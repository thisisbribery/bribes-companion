<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bribes Companion</title>
<style>
  :root {
    --bg: #0e0f12; --panel: #17191e; --line: #2a2d35; --text: #e8e6e1; --dim: #8a8d96;
    --ok: #4fbf7a; --warn: #e0a83a; --bad: #e0574a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0 auto 0 0; letter-spacing: .04em; }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; font: inherit; }
  button { cursor: pointer; }
  #status { color: var(--dim); font-size: 14px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  #hero { margin-top: 16px; border-radius: 16px; padding: 28px 24px; min-height: 220px; display: flex; flex-direction: column;
    justify-content: flex-end; background: var(--panel); border: 1px solid var(--line); transition: background .2s; }
  #family { font-size: 14px; letter-spacing: .2em; text-transform: uppercase; opacity: .8; }
  #engine { font-size: 56px; font-weight: 800; line-height: 1.05; margin: 4px 0; word-break: break-word; }
  #preset { font-size: 24px; opacity: .9; }
  #rowname { font-size: 18px; opacity: .75; margin-top: 4px; }
  #rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-top: 16px; }
  .row { border-radius: 10px; padding: 10px 8px; font-size: 12px; background: var(--panel); border: 2px solid transparent;
    min-height: 56px; display: flex; flex-direction: column; justify-content: space-between; }
  .row.sel { border-color: var(--text); }
  .row b { font-size: 11px; opacity: .7; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 16px 0 0; font-size: 14px; }
  dt { color: var(--dim); } dd { margin: 0; font-family: ui-monospace, monospace; }
  details { margin-top: 16px; } summary { color: var(--dim); cursor: pointer; }
  #log { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; color: var(--dim);
    max-height: 260px; overflow: auto; background: var(--panel); padding: 10px; border-radius: 8px; }
  #top { display: grid; grid-template-columns: auto 1fr; gap: 16px; margin-top: 16px; align-items: stretch; }
  #mirror { background: #050506; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: flex;
    align-items: center; }
  #mirror svg { width: 260px; height: auto; display: block; }
  .seg { fill: #2a0f0f; } .seg.on { fill: #ff3b2f; filter: drop-shadow(0 0 4px rgba(255, 59, 47, .7)); }
  #spelled { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px;
    display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  #menuName { color: var(--dim); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; min-height: 20px; }
  #fullText { font-size: 34px; font-weight: 700; line-height: 1.15; word-break: break-word; }
  #rawText { color: var(--dim); font: 13px ui-monospace, monospace; margin-top: 6px; }
  #fullText.popup { color: var(--warn); }
  #mirror { flex-direction: column; gap: 10px; justify-content: center; }
  #oled { width: 384px; max-width: 100%; image-rendering: pixelated; display: none; background: #000; border-radius: 4px; }
  .mode { display: flex; gap: 0; }
  .mode button { padding: 6px 12px; font-size: 13px; border-radius: 0; }
  .mode button:first-child { border-radius: 8px 0 0 8px; } .mode button:last-child { border-radius: 0 8px 8px 0; }
  .mode button.on { background: var(--text); color: var(--bg); }
  #picker { display: none; margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; }
  #pickerTitle { color: var(--dim); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; }
  #pickerTiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .tile { background: #22252c; border: 2px solid transparent; border-radius: 12px; padding: 18px 12px; font-size: 18px;
    font-weight: 700; text-align: center; color: var(--text); cursor: pointer; min-height: 72px; }
  .tile.sel { border-color: var(--warn); background: #3a3122; }
  .tile.tapped { opacity: .6; }
  @media (max-width: 600px) { #engine { font-size: 40px; } #top { grid-template-columns: 1fr; } #mirror svg { width: 100%; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>BRIBES COMPANION <span style="color:var(--dim);font-weight:400">debug v2</span></h1>
    <select id="port" aria-label="Deluge port"></select>
    <button id="connect">Connect</button>
  </header>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">Not connected</span></div>

  <section id="top">
    <div id="mirror" aria-label="Deluge display mirror">
      <svg id="segsvg" viewBox="0 0 236 100"></svg>
      <canvas id="oled" width="128" height="48"></canvas>
      <div class="mode"><button id="mode7">7SEG</button><button id="modeOled">OLED</button></div>
    </div>
    <div id="spelled">
      <div id="menuName"></div>
      <div id="fullText">-</div>
      <div id="rawText"></div>
    </div>
  </section>

  <section id="picker">
    <div id="pickerTitle"></div>
    <div id="pickerTiles"></div>
  </section>

  <section id="hero">
    <div id="family">waiting</div>
    <div id="engine">-</div>
    <div id="preset"></div>
    <div id="rowname"></div>
  </section>

  <div id="rows"></div>

  <dl id="fields"></dl>

  <details open>
    <summary>Raw messages</summary>
    <div id="log"></div>
  </details>
</main>

<script>
"use strict";
// Messages: F0 00 21 7B 01 02 03 <mode> F7 out (0 = subscribe + send all, 1 = keep alive), 0x42 STATE / 0x43 KIT_ROWS /
// 0x44 TEXT / 0x45 PICKER in, 03 02 <n> out = choose picker option n. Display mirror: 00 <2 keep alive | 3 force |
// 4 swap 7SEG/OLED> out, 0x41 7-seg digits / 0x40 OLED frame in.
var HDR = [0xF0, 0x00, 0x21, 0x7B, 0x01, 0x02];

// drum_synth::Engine numbers (append-only in the firmware) and the special codes above them
var ENGINES = [
  ["LXR DRUM", "lxr"], ["LXR SNARE", "lxr"], ["LXR METAL", "lxr"],
  ["DXIA", "xia"], ["DIIA", "xia"],
  ["CYC KIK", "cyc"], ["CYC SNR", "cyc"], ["CYC METAL", "cyc"], ["CYC PERC", "cyc"],
  ["CYC TONE", "cyc"], ["CYC CHORD", "cyc"], ["VTG SNR", "cyc"], ["CLAP", "cyc"],
  ["GIN", "gin"], ["ULTRAKIK", "ultrakik"], ["BRIBERING", "rings"], ["BROPHET", "brophet"], ["BRUNO106", "bruno"]
];
var SPECIAL = {
  0x7A: ["303", "tb303"], 0x7B: ["DELUGE SYNTH", "deluge"], 0x7C: ["DX7", "dx7"],
  0x7D: ["MIDI / GATE", "midi"], 0x7E: ["SAMPLE", "sample"], 0x7F: ["NONE", "none"]
};
// Placeholder colours per family until the art exists
var FAMILY_COLOUR = {
  lxr: "#7a2e2e", xia: "#2e4f7a", cyc: "#2e6a7a", gin: "#6a5a2e", ultrakik: "#7a3e1e", rings: "#3e2e7a",
  brophet: "#5a2e6a", bruno: "#2e6a4a", tb303: "#7a6a1e", deluge: "#3a3d46", dx7: "#4a3a2e", midi: "#2a2d35",
  sample: "#33404a", none: "#17191e"
};
var FAMILY_NAME = {
  lxr: "LXR drum voice", xia: "XIA engine", cyc: "Cyc engine", gin: "GIN", ultrakik: "Kick engine",
  rings: "Resonator", brophet: "Poly synth", bruno: "DCO poly", tb303: "Bass line", deluge: "Deluge synth",
  dx7: "FM operator synth", midi: "External", sample: "Sample", none: "-"
};
var OUTPUT_TYPES = ["SYNTH", "KIT", "MIDI", "CV", "AUDIO"];
var SYNTH_MODES = ["SUBTRACTIVE", "FM", "RINGMOD", "TB303"];
var OSC_TYPES = ["SINE", "TRIANGLE", "SQUARE", "ANALOG SQUARE", "SAW", "ANALOG SAW", "WAVETABLE", "SAMPLE", "DX7",
  "DRUM SYNTH", "INPUT L", "INPUT R", "INPUT STEREO"];
var RINGS_MODELS = ["MODAL", "SYMPATHETIC", "STRING", "FM", "CHORD"];

function engineInfo(code) {
  if (code < ENGINES.length) return ENGINES[code];
  return SPECIAL[code] || ["ENGINE " + code, "none"];
}
function pick(list, v) { return v === 0x7F ? "-" : (list[v] !== undefined ? list[v] : String(v)); }
function hex(bytes) { return Array.prototype.map.call(bytes, function (b) { return ("0" + b.toString(16)).slice(-2); }).join(" "); }

// 7-seg mirror: bit 6 = A (top) ... bit 0 = G (middle), 0x80 = dot. Segment polygons per digit, 50 wide, 100 high
var SEG_SHAPES = [
  [6, "M10,4 L40,4 L35,10 L15,10 Z"],          // A
  [5, "M42,6 L42,46 L37,42 L37,12 Z"],          // B
  [4, "M42,54 L42,94 L37,88 L37,58 Z"],         // C
  [3, "M10,96 L40,96 L35,90 L15,90 Z"],         // D
  [2, "M8,54 L8,94 L13,88 L13,58 Z"],           // E
  [1, "M8,6 L8,46 L13,42 L13,12 Z"],            // F
  [0, "M11,50 L16,46 L34,46 L39,50 L34,54 L16,54 Z"] // G
];
function buildMirror() {
  var svg = $("segsvg"), html = "";
  for (var d = 0; d < 4; d++) {
    html += '<g transform="translate(' + (d * 58 + 2) + ',0)">';
    SEG_SHAPES.forEach(function (sg) { html += '<path class="seg" data-d="' + d + '" data-b="' + sg[0] + '" d="' + sg[1] + '"/>'; });
    html += '<circle class="seg" data-d="' + d + '" data-b="7" cx="48" cy="94" r="3.5"/></g>';
  }
  svg.innerHTML = html;
}
function showDigits(digits) {
  var els = $("segsvg").querySelectorAll(".seg");
  for (var k = 0; k < els.length; k++) {
    var e = els[k], v = digits[+e.getAttribute("data-d")], b = +e.getAttribute("data-b");
    e.setAttribute("class", (v >> b) & 1 ? "seg on" : "seg");
  }
}

// OLED mirror: 128 x 48, 6 pages of 128 bytes, bit n of a byte = pixel n down that page
var oledImage = new Uint8Array(768), screenMode = "7seg";

// Inverse of the firmware's pack_8to7_rle
function unpackRle(d, start, end) {
  var out = [], i = start;
  while (i < end) {
    var b = d[i++];
    if (b < 64) {
      var size, high;
      if (b < 4) { size = 2; high = b; } else if (b < 12) { size = 3; high = b - 4; }
      else if (b < 28) { size = 4; high = b - 12; } else { size = 5; high = b - 28; }
      for (var j = 0; j < size; j++) out.push(d[i++] | (((high >> j) & 1) << 7));
    } else {
      var top = (b & 1) << 7, n = (b - 64) >> 1;
      if (n === 1) { out.push(d[i++] | top); continue; }
      if (n === 31) n = 31 + d[i++];
      var v = d[i++] | top;
      for (var r = 0; r < n; r++) out.push(v);
    }
  }
  return out;
}
// Inverse of pack_8bit_to_7bit: groups of a high-bits byte then up to 7 bytes
function unpack7(d, start, end) {
  var out = [];
  for (var i = start; i < end; i += 8) {
    var hi = d[i];
    for (var j = 0; j < 7 && i + 1 + j < end; j++) out.push(d[i + 1 + j] | (((hi >> j) & 1) << 7));
  }
  return out;
}
function drawOled() {
  var c = $("oled"), ctx = c.getContext("2d"), img = ctx.createImageData(128, 48);
  for (var y = 0; y < 48; y++) for (var x = 0; x < 128; x++) {
    var on = (oledImage[(y >> 3) * 128 + x] >> (y & 7)) & 1, p = (y * 128 + x) * 4;
    img.data[p] = on ? 235 : 0; img.data[p + 1] = on ? 240 : 0; img.data[p + 2] = on ? 255 : 0; img.data[p + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
function setScreenMode(mode) {
  screenMode = mode;
  $("segsvg").style.display = mode === "7seg" ? "" : "none";
  $("oled").style.display = mode === "oled" ? "block" : "none";
  $("mode7").className = mode === "7seg" ? "on" : "";
  $("modeOled").className = mode === "oled" ? "on" : "";
}
function wantScreen(mode) {
  if (!output || mode === screenMode) return;
  output.send(HDR.concat([0x00, 0x04, 0xF7])); // swap the Deluge's display type, as DEx does
  setScreenMode(mode);
  setTimeout(function () { sendDisplay(true); }, 150);
}

// Picker (any open context menu)
var picker = null;
function showPicker(p) {
  picker = p.open ? p : null;
  $("picker").style.display = picker ? "block" : "none";
  if (!picker) return;
  $("pickerTitle").textContent = p.title;
  var tiles = $("pickerTiles");
  tiles.innerHTML = "";
  p.options.forEach(function (name, idx) {
    var t = document.createElement("button");
    t.className = "tile" + (idx === p.selected ? " sel" : "");
    t.textContent = name;
    t.onclick = function () {
      if (!output) return;
      t.className += " tapped";
      output.send(HDR.concat([0x03, 0x02, idx, 0xF7]));
    };
    tiles.appendChild(t);
  });
}

var midi = null, input = null, output = null, keepAlive = null;
var lastMessageAt = 0, lastSeq = -1, dropped = 0, stateCount = 0;
var state = null, rows = null;

function $(id) { return document.getElementById(id); }
function setStatus(text, level) { $("statusText").textContent = text; $("dot").className = "dot " + (level || ""); }
function log(dir, bytes) {
  var el = $("log");
  var line = new Date().toLocaleTimeString() + " " + dir + " " + hex(bytes) + "\n";
  el.textContent = (line + el.textContent).slice(0, 6000);
}

function sendDisplay(force) {
  if (!output) return;
  output.send(HDR.concat([0x00, force ? 0x03 : 0x02, 0xF7]));
}

function send(mode) {
  if (!output) return;
  var msg = HDR.concat([0x03, mode, 0xF7]);
  output.send(msg);
  if (mode === 0) log(">", msg);
}

function readName(d, i) {
  var n = d[i], s = "";
  for (var k = 0; k < n; k++) s += String.fromCharCode(d[i + 1 + k]);
  return { text: s, next: i + 1 + n };
}

// Exposed for offline tests
function parse(d) {
  for (var h = 0; h < HDR.length; h++) if (d[h] !== HDR[h]) return null;
  var kind = d[6];
  if (kind === 0x42) {
    var seq = d[7], i = 8;
    var s = { kind: "state", seq: seq, version: d[i++], outType: d[i++], synthMode: d[i++], osc0: d[i++],
      engine: d[i++], engineSub: d[i++] };
    s.track = (d[i] << 7) | d[i + 1]; i += 2;
    s.row = d[i++];
    var a = readName(d, i); s.name = a.text;
    var b = readName(d, a.next); s.rowName = b.text;
    s.ok = d[b.next] === 0xF7;
    return s;
  }
  if (kind === 0x40) {
    var last = d.length - 1; // F7
    if (d[7] === 0x02) return { kind: "oled", offset: 8 * d[8], bytes: unpackRle(d, 10, last) };
    return { kind: "oled", offset: 0, bytes: d[7] === 0x01 ? unpackRle(d, 9, last) : unpack7(d, 9, last) };
  }
  if (kind === 0x45) {
    var pk = { kind: "picker", version: d[7], open: d[8] === 1, selected: d[9], options: [] }, count = d[10], pj = 11, pr;
    pr = readName(d, pj); pk.title = pr.text; pj = pr.next;
    for (var o = 0; o < count; o++) { pr = readName(d, pj); pk.options.push(pr.text); pj = pr.next; }
    pk.ok = d[pj] === 0xF7;
    return pk;
  }
  if (kind === 0x41) {
    // 00 00, then 7-bit packed: one byte of high bits, then 4 digit bytes (left to right)
    var hi = d[9], digits = [];
    for (var q = 0; q < 4; q++) digits.push(d[10 + q] | (((hi >> q) & 1) << 7));
    return { kind: "seg", digits: digits };
  }
  if (kind === 0x44) {
    var t = { kind: "text", version: d[7], popup: (d[8] & 1) === 1 }, j = 9, r;
    r = readName(d, j); t.main = r.text; j = r.next;
    r = readName(d, j); t.mainEnglish = r.text; j = r.next;
    r = readName(d, j); t.popupText = r.text; j = r.next;
    r = readName(d, j); t.popupEnglish = r.text; j = r.next;
    r = readName(d, j); t.menu = r.text; j = r.next;
    t.ok = d[j] === 0xF7;
    return t;
  }
  if (kind === 0x43) {
    var count = d[8], list = [];
    for (var r = 0; r < count; r++) list.push(d[9 + r]);
    return { kind: "rows", version: d[7], rows: list, ok: d[9 + count] === 0xF7 };
  }
  return null;
}

function onMessage(ev) {
  var m = parse(ev.data);
  if (!m) return;
  lastMessageAt = Date.now();
  if (m.kind === "seg") { if (screenMode !== "7seg") setScreenMode("7seg"); showDigits(m.digits); return; }
  if (m.kind === "oled") {
    if (screenMode !== "oled") setScreenMode("oled");
    for (var k = 0; k < m.bytes.length && m.offset + k < 768; k++) oledImage[m.offset + k] = m.bytes[k];
    drawOled();
    return;
  }
  log("<", ev.data);
  if (m.kind === "text") { showText(m); return; }
  if (m.kind === "picker") { showPicker(m); return; }
  if (m.kind === "state") {
    if (lastSeq >= 0 && m.seq !== ((lastSeq + 1) & 0x7F)) dropped++;
    lastSeq = m.seq; stateCount++;
    state = m;
  } else {
    rows = m.rows;
  }
  render();
}

function showText(t) {
  var shown = t.popup ? t.popupEnglish : t.mainEnglish, raw = t.popup ? t.popupText : t.main;
  $("menuName").textContent = t.menu;
  $("fullText").textContent = shown || "-";
  $("fullText").className = t.popup ? "popup" : "";
  $("rawText").textContent = raw && raw !== shown ? "7-seg: " + raw : "";
}

function render() {
  if (!state) return;
  var info = engineInfo(state.engine);
  var family = info[1];
  $("hero").style.background = FAMILY_COLOUR[family] || "";
  $("family").textContent = FAMILY_NAME[family] || family;
  var engineText = info[0];
  if (family === "deluge") engineText = pick(SYNTH_MODES, state.synthMode);
  if (family === "rings") engineText += " " + pick(RINGS_MODELS, state.engineSub);
  $("engine").textContent = engineText;
  $("preset").textContent = state.name || "(unnamed)";
  $("rowname").textContent = state.outType === 1 ? "Row " + (state.row === 0x7F ? "-" : state.row + 1) +
    (state.rowName ? ": " + state.rowName : "") : "";

  var rowsEl = $("rows");
  rowsEl.innerHTML = "";
  if (state.outType === 1 && rows) {
    rows.forEach(function (code, idx) {
      var ri = engineInfo(code);
      var div = document.createElement("div");
      div.className = "row" + (idx === state.row ? " sel" : "");
      div.style.background = FAMILY_COLOUR[ri[1]] || "";
      div.innerHTML = "<b>" + (idx + 1) + "</b><span></span>";
      div.lastChild.textContent = ri[0];
      rowsEl.appendChild(div);
    });
  }

  var f = [
    ["Output", pick(OUTPUT_TYPES, state.outType)], ["Synth mode", pick(SYNTH_MODES, state.synthMode)],
    ["Osc 1", pick(OSC_TYPES, state.osc0)], ["Engine code", state.engine + " (0x" + state.engine.toString(16) + ")"],
    ["Engine sub", state.engineSub], ["Track", state.track === 0x3FFF ? "-" : state.track + 1],
    ["Messages", stateCount + " state, seq " + state.seq + ", gaps " + dropped], ["Spec version", state.version]
  ];
  $("fields").innerHTML = "";
  f.forEach(function (p) {
    var dt = document.createElement("dt"); dt.textContent = p[0];
    var dd = document.createElement("dd"); dd.textContent = p[1];
    $("fields").appendChild(dt); $("fields").appendChild(dd);
  });
}

function listPorts() {
  var sel = $("port"), prev = sel.value;
  sel.innerHTML = "";
  var outs = [];
  midi.outputs.forEach(function (o) { outs.push(o); });
  outs.forEach(function (o) {
    var opt = document.createElement("option");
    opt.value = o.id; opt.textContent = o.name;
    sel.appendChild(opt);
  });
  if (prev && outs.some(function (o) { return o.id === prev; })) sel.value = prev;
  else {
    var d = outs.filter(function (o) { return /deluge/i.test(o.name); });
    if (d.length) sel.value = d[0].id;
  }
  if (!outs.length) setStatus("No MIDI devices. Plug in the Deluge, then reload.", "bad");
}

function usePort() {
  if (input) input.onmidimessage = null;
  output = midi.outputs.get($("port").value) || null;
  input = null;
  if (output) {
    // The Deluge replies on the cable the request came in on: match the input by name
    midi.inputs.forEach(function (i) { if (!input && i.name === output.name) input = i; });
    if (!input) midi.inputs.forEach(function (i) { if (!input && /deluge/i.test(i.name)) input = i; });
  }
  if (!output || !input) { setStatus("Pick the Deluge port", "bad"); return; }
  input.onmidimessage = onMessage;
  lastSeq = -1; dropped = 0;
  send(0);
  sendDisplay(true);
  setStatus("Asked " + output.name + " for state...", "warn");
}

$("connect").onclick = function () {
  if (!navigator.requestMIDIAccess) { setStatus("This browser has no Web MIDI. Use Chrome.", "bad"); return; }
  navigator.requestMIDIAccess({ sysex: true }).then(function (access) {
    midi = access;
    midi.onstatechange = function () { listPorts(); };
    listPorts();
    usePort();
    if (keepAlive) clearInterval(keepAlive);
    keepAlive = setInterval(function () {
      send(1);
      sendDisplay(false);
      var age = Date.now() - lastMessageAt;
      if (!lastMessageAt) setStatus("Connected to " + (output ? output.name : "?") +
        ". No reply yet: is this the Bribes companion test bin?", "warn");
      else setStatus("Live on " + output.name + " (last message " + Math.round(age / 1000) + " s ago)", "ok");
    }, 1000);
    $("connect").textContent = "Resend";
  }, function (err) { setStatus("MIDI access refused: " + err, "bad"); });
};
buildMirror();
setScreenMode("7seg");
$("mode7").onclick = function () { wantScreen("7seg"); };
$("modeOled").onclick = function () { wantScreen("oled"); };
// Leaving the page in OLED mode would leave the 7-seg frozen: swap back on the way out
window.addEventListener("pagehide", function () { if (screenMode === "oled" && output) output.send(HDR.concat([0x00, 0x04, 0xF7])); });
$("port").onchange = function () { if (midi) usePort(); };
if (typeof module !== "undefined") module.exports = { parse: parse };
</script>
