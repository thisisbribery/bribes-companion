<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bribes Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121417">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#121417; --panel:#1a1d21; --ink:#e9e7e2; --muted:#9aa0a8; --line:#2c3036; --soft:#22262b;
  --pink:#ff1fd6; --pink-glow:rgba(255,31,214,.45); --accent:var(--pink);
  --teal:#19ffe0; --ok:#69db7c; --bad:#ff8787; --warn:#ffa94d;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:0 auto;padding:18px 16px 48px}
button,select{font:600 15px var(--sans);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--panel)}
button.secondary,select{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
select{font-weight:500}

/* Byline and header, as on the Seal Eggs flasher */
.byline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.coinlink{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-size:14px;line-height:1.25}
.coinlink:hover{border-color:var(--pink)}
.coinlink small{display:block;white-space:nowrap;color:var(--muted);font-size:12.5px}
.coin{display:block;width:40px;height:40px;perspective:220px;flex:0 0 auto}
.coin-inner{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:coinspin 4s steps(24) infinite}
.coin img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(2.5px)}
.coin .back{transform:rotateY(180deg) translateZ(2.5px)}
.coin .edge{display:block;position:absolute;left:50%;top:8%;width:5px;height:84%;margin-left:-2.5px;background:linear-gradient(#9a9a9a,#6f6f6f 50%,#4a4a4a);transform:rotateY(90deg)}
@keyframes coinspin{to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.coin-inner{animation:none}}
.title{display:flex;align-items:baseline;gap:10px;margin:0 auto 0 0}
h1{font-size:24px;line-height:1.1;margin:0;letter-spacing:-.01em}
h1 span{color:var(--pink)}
.ver{font:500 11.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.conn{display:flex;gap:8px;align-items:center;margin-left:auto}
.pill{display:inline-flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:0 0 auto}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.warn{background:var(--warn)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.label{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Display mirror and spelled-out text */
#top{display:grid;grid-template-columns:auto 1fr;gap:14px;margin-top:16px;align-items:stretch}
#mirror{background:#060607;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}
#mirror svg{width:250px;height:auto;display:block}
.seg{fill:#2a0f0f} .seg.on{fill:#ff3b2f;filter:drop-shadow(0 0 4px rgba(255,59,47,.7))}
#oled{width:384px;max-width:100%;image-rendering:pixelated;display:none;background:#000;border-radius:4px}
.mode{display:flex}
.mode button{padding:6px 12px;font-size:12.5px;border-radius:0;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.mode button:first-child{border-radius:8px 0 0 8px} .mode button:last-child{border-radius:0 8px 8px 0}
.mode button.on{background:var(--pink);color:var(--panel);border-color:var(--pink)}
#spelled{display:flex;flex-direction:column;justify-content:center;min-width:0}
#fullText{font-size:34px;font-weight:700;line-height:1.15;word-break:break-word;margin-top:2px}
#fullText.popup{color:var(--pink)}
#rawText{color:var(--muted);font:13px var(--mono);margin-top:6px}

/* Pickers */
#picker,#browser{display:none;margin-top:14px}
#pickerTitle,#browserTitle{margin-bottom:12px}
#pickerTiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
#pickerTiles.art{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.tile{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px 12px;font:700 18px var(--sans);color:var(--ink);min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:border-color .15s,box-shadow .15s}
.tile svg{width:100%;height:auto;display:block}
.tile.sel{border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink),0 0 16px var(--pink-glow)}
.tile.tapped{opacity:.6}

/* Preset browser */
.bhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bhead .label{margin:0 auto 0 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bhead button{padding:8px 14px;font-size:14px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 10px}
#browserList{max-height:55vh;overflow-y:auto;border-radius:10px;border:1px solid var(--line)}
.item{padding:12px 14px;font-size:18px;border-bottom:1px solid var(--line);display:flex;gap:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.item:last-child{border-bottom:0}
.item .n{color:var(--muted);font:13px var(--mono);min-width:38px;padding-top:4px}
.item.folder{color:var(--muted)} .item.folder .n{color:var(--pink)}
.item.sel{background:color-mix(in srgb,var(--pink) 14%,var(--panel));color:var(--ink);box-shadow:inset 4px 0 0 var(--pink)}
.item.tapped{opacity:.55}

/* Engine view */
#hero{margin-top:14px;display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:20px;align-items:center}
#heroArt{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;aspect-ratio:16/10;display:flex;align-items:center}
#heroArt svg{width:100%;height:auto;display:block}
#engine{font-size:52px;font-weight:800;line-height:1.05;margin:4px 0;word-break:break-word;letter-spacing:-.01em}
#preset{font-size:24px}
#rowname{font-size:17px;color:var(--muted);margin-top:4px}
#rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:12px}
.row{border-radius:10px;padding:8px;font-size:12.5px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.row svg{width:100%;height:auto;display:block}
.row b{font:600 11px var(--mono);color:var(--muted)}
.row.sel{border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink),0 0 12px var(--pink-glow)}
.row.sel b{color:var(--pink)}

details{margin-top:18px} summary{color:var(--muted);cursor:pointer;font-size:14px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:12px 0 0;font-size:14px}
dt{color:var(--muted)} dd{margin:0;font-family:var(--mono)}
#log{font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;color:var(--muted);max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:10px;margin-top:10px}
footer{color:var(--muted);font-size:13px;margin-top:22px}
footer a{color:var(--pink)}
@media (max-width:640px){
  #top,#hero{grid-template-columns:1fr} #mirror svg{width:100%} #engine{font-size:38px} h1{font-size:20px}
  .conn{margin-left:0;width:100%} .conn select{flex:1}
}
</style>
</head>
<body>
<main>
  <div class="byline">
    <a class="coinlink" href="https://www.instagram.com/thisisbribery/" target="_blank" rel="noopener">
      <span class="coin" aria-hidden="true"><span class="coin-inner"><img src="assets/coin-front.png" alt=""><span class="edge"></span><img class="back" src="assets/coin-back.png" alt=""></span></span>
      <span>Mods by <b>Bribery</b><small>@thisisbribery on Instagram &#8599;</small></span>
    </a>
    <div class="title"><h1>Bribes <span>Companion</span></h1><span class="ver">v4</span></div>
    <div class="conn">
      <select id="port" aria-label="Deluge port"></select>
      <button id="connect">Connect</button>
    </div>
  </div>
  <div class="pill"><span class="dot" id="dot"></span><span id="statusText">Not connected</span></div>

  <section id="top">
    <div id="mirror" aria-label="Deluge display mirror">
      <svg id="segsvg" viewBox="0 0 236 100"></svg>
      <canvas id="oled" width="128" height="48"></canvas>
      <div class="mode"><button id="mode7">7SEG</button><button id="modeOled">OLED</button></div>
    </div>
    <div id="spelled" class="card">
      <div class="label" id="menuName"></div>
      <div id="fullText">-</div>
      <div id="rawText"></div>
    </div>
  </section>

  <section id="picker" class="card">
    <div class="label" id="pickerTitle"></div>
    <div id="pickerTiles"></div>
  </section>

  <section id="browser" class="card">
    <div class="bhead">
      <div class="label" id="browserTitle"></div>
      <button class="secondary" id="bBack">Back</button>
      <button id="bLoad">Load</button>
    </div>
    <p class="hint">Tap to select, like turning the select knob. Tap it again, or Load, to press select.</p>
    <div id="browserList"></div>
  </section>

  <section id="hero" class="card">
    <div id="heroArt"></div>
    <div>
      <div class="label" id="family">waiting</div>
      <div id="engine">-</div>
      <div id="preset"></div>
      <div id="rowname"></div>
    </div>
  </section>

  <div id="rows"></div>

  <details>
    <summary>Debug</summary>
    <dl id="fields"></dl>
    <div id="log"></div>
  </details>

  <footer>Runs entirely in your browser. Not affiliated with or endorsed by Synthstrom Audible.</footer>
</main>

<script>
"use strict";
// Messages: F0 00 21 7B 01 02 03 <mode> F7 out (0 = subscribe + send all, 1 = keep alive, 2 <n> = choose picker option
// n, 3 <hi> <lo> = move the browser to that item, 4 = press SELECT, 5 = press BACK). In: 0x42 STATE, 0x43 KIT_ROWS,
// 0x44 TEXT, 0x45 PICKER, 0x46 BROWSER, 0x47 BROWSER_SEL. Display mirror: 00 <2 keep alive | 3 force | 4 swap
// 7SEG/OLED> out, 0x41 7-seg digits / 0x40 OLED frame in.
var HDR = [0xF0, 0x00, 0x21, 0x7B, 0x01, 0x02];

// drum_synth::Engine numbers (append-only in the firmware) and the special codes above them
var ENGINES = [
  ["LXR DRUM", "lxr"], ["LXR SNARE", "lxr"], ["LXR METAL", "lxr"],
  ["DXIA", "xia"], ["DIIA", "xia"],
  ["CYC KIK", "cyc"], ["CYC SNR", "cyc"], ["CYC METAL", "cyc"], ["CYC PERC", "cyc"],
  ["CYC TONE", "cyc"], ["CYC CHORD", "cyc"], ["VTG SNR", "cyc"], ["CLAP", "cyc"],
  ["GIN", "gin"], ["ULTRAKIK", "ultrakik"], ["BRIBERING", "rings"], ["BROPHET", "brophet"], ["BRUNO106", "bruno"]
];
var SPECIAL = {
  0x7A: ["303", "tb303"], 0x7B: ["DELUGE SYNTH", "deluge"], 0x7C: ["DX7", "dx7"],
  0x7D: ["MIDI / GATE", "midi"], 0x7E: ["SAMPLE", "sample"], 0x7F: ["NONE", "none"]
};
var FAMILY_NAME = {
  lxr: "LXR drum voice", xia: "XIA engine", cyc: "Cycles engine", gin: "GIN", ultrakik: "Kick engine",
  rings: "Resonator", brophet: "Poly synth", bruno: "DCO poly", tb303: "Bass line", deluge: "Deluge synth",
  dx7: "FM operator synth", midi: "External", sample: "Sample", none: "-"
};
var OUTPUT_TYPES = ["SYNTH", "KIT", "MIDI", "CV", "AUDIO"];
var SYNTH_MODES = ["SUBTRACTIVE", "FM", "RINGMOD", "TB303"];
var OSC_TYPES = ["SINE", "TRIANGLE", "SQUARE", "ANALOG SQUARE", "SAW", "ANALOG SAW", "WAVETABLE", "SAMPLE", "DX7",
  "DRUM SYNTH", "INPUT L", "INPUT R", "INPUT STEREO"];
var RINGS_MODELS = ["MODAL", "SYMPATHETIC", "STRING", "FM", "CHORD"];

function engineInfo(code) {
  if (code < ENGINES.length) return ENGINES[code];
  return SPECIAL[code] || ["ENGINE " + code, "none"];
}
function pick(list, v) { return v === 0x7F ? "-" : (list[v] !== undefined ? list[v] : String(v)); }
function hex(bytes) { return Array.prototype.map.call(bytes, function (b) { return ("0" + b.toString(16)).slice(-2); }).join(" "); }

// ---- Engine art: small SVG drawings, 160 x 100 ----
var artSeq = 0;
function R(x, y, w, h, f, rx, ex) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 0) + '" fill="' + f + '"' + (ex || "") + "/>";
}
function C(cx, cy, r, f, ex) { return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + f + '"' + (ex || "") + "/>"; }
function L(d, s, w, ex) {
  return '<path d="' + d + '" fill="none" stroke="' + s + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || "") + "/>";
}
function knob(cx, cy, r, f, m) {
  return C(cx, cy, r, f) + '<line x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + (cy - r + 1.2) + '" stroke="' + m + '" stroke-width="1.4" stroke-linecap="round"/>';
}
function keys(x, y, w, h, n, wc, bc) {
  var s = R(x, y, w, h, "#0b0c0e", 1.5), kw = w / n, i, pat = [1, 1, 0, 1, 1, 1, 0];
  for (i = 0; i < n; i++) s += R((x + i * kw + 0.5).toFixed(1), y, (kw - 1).toFixed(1), h, wc, 1);
  for (i = 0; i < n - 1; i++) if (pat[i % 7]) s += R((x + (i + 1) * kw - kw * 0.32).toFixed(1), y, (kw * 0.64).toFixed(1), (h * 0.6).toFixed(1), bc, 0.8);
  return s;
}
function wave(x, y, w, a, fn, n) {
  var d = "", steps = n || 48;
  for (var i = 0; i <= steps; i++) {
    var t = i / steps;
    d += (i ? " L" : "M") + (x + t * w).toFixed(1) + " " + (y - a * fn(t)).toFixed(1);
  }
  return d;
}
function sin(c) { return function (t) { return Math.sin(t * Math.PI * 2 * c); }; }
var ART = {
  // Cycles: a white drum machine
  cyc: function () {
    var s = R(10, 16, 140, 70, "#f3f1ec", 7, ' stroke="#cdc8bd" stroke-width="1.5"') + R(18, 24, 40, 14, "#1d1f22", 3) +
      R(22, 29, 18, 3, "#ff1fd6", 1) + R(22, 33, 26, 2, "#9aa0a8", 1);
    for (var i = 0; i < 6; i++) s += knob(70 + i * 13, 31, 4.6, "#2a2c30", "#f3f1ec");
    for (var r = 0; r < 2; r++) for (var p = 0; p < 8; p++) {
      var lit = (r === 0 && p === 2) || (r === 1 && p === 5);
      s += R(18 + p * 16, 46 + r * 18, 13, 13, lit ? "#ff1fd6" : "#dcd8cf", 2.5);
    }
    return s;
  },
  // LXR: a black drum machine
  lxr: function () {
    var s = R(10, 16, 140, 70, "#141518", 7, ' stroke="#3a3d44" stroke-width="1.5"') + R(18, 23, 34, 16, "#2b1d05", 2) +
      R(21, 27, 22, 3, "#ffb020", 1) + R(21, 33, 14, 2, "#ffb020", 1, ' opacity=".6"');
    for (var i = 0; i < 6; i++) { s += knob(62 + i * 14, 26, 4.2, "#d5d8de", "#141518") + knob(62 + i * 14, 39, 4.2, "#d5d8de", "#141518"); }
    for (var k = 0; k < 16; k++) {
      var x = 16 + k * 8.2;
      s += C((x + 3).toFixed(1), 51, 1.3, k % 4 === 0 ? "#ff3b2f" : "#3a1a1a") + R(x.toFixed(1), 55, 6, 10, "#2a2c31", 1.5);
    }
    for (var b = 0; b < 8; b++) s += R(16 + b * 12, 71, 9, 9, "#26282d", 2);
    return s + knob(132, 75, 7, "#2a2c31", "#d5d8de");
  },
  // GIN: a bare green circuit board with a little screen
  gin: function () {
    var s = R(30, 6, 100, 88, "#1e6b3c", 5, ' stroke="#2f8a52" stroke-width="1.5"') +
      L("M36 46 H48 V40 M112 46 H124 V60 M36 88 H50 M110 88 H124", "#3f9d63", 1.2) +
      R(52, 12, 56, 28, "#a9bfa2", 3) + L(wave(56, 28, 48, 8, function (t) { return Math.exp(-4 * t) * Math.sin(t * 30); }), "#1d2a1c", 1.6) +
      knob(41, 24, 5.5, "#ecebe6", "#1e6b3c") + knob(119, 24, 5.5, "#ecebe6", "#1e6b3c");
    for (var j = 0; j < 4; j++) for (var i = 0; i < 4; i++) s += C(56 + i * 16, 52 + j * 11, 4.4, i === 1 && j === 2 ? "#ff1fd6" : "#ecebe6");
    return s;
  },
  // Sample kit: pads and a waveform screen
  kit: function () {
    var s = R(14, 14, 132, 72, "#2a2d33", 7) + R(22, 22, 116, 20, "#0f1114", 3), d = "";
    for (var i = 0; i < 38; i++) {
      var x = 26 + i * 2.9, a = 8 * Math.exp(-i / 12) * (0.4 + 0.6 * Math.abs(Math.sin(i * 1.7)));
      d += "M" + x.toFixed(1) + " " + (32 - a).toFixed(1) + " V" + (32 + a).toFixed(1) + " ";
    }
    s += L(d, "#ff1fd6", 1.6);
    for (var r = 0; r < 2; r++) for (var p = 0; p < 6; p++) s += R(22 + p * 19.6, 48 + r * 19, 16, 16, r === 0 && p === 0 ? "#ff1fd6" : "#3b3f47", 3);
    return s;
  },
  // Kick engine: a bass drum from the front
  ultrakik: function () {
    var s = L("M54 82 L44 96 M106 82 L116 96", "#c9ccd2", 3) + C(80, 48, 41, "#8e1b2b") + C(80, 48, 41, "none", ' stroke="#c9ccd2" stroke-width="3.5"') +
      C(80, 48, 33, "#f1ede4");
    for (var k = 0; k < 8; k++) {
      var a = k * Math.PI / 4, x = 80 + Math.cos(a) * 41, y = 48 + Math.sin(a) * 41;
      s += C(x.toFixed(1), y.toFixed(1), 2.6, "#e2e4e8");
    }
    return s + C(80, 48, 14, "#ff1fd6", ' opacity=".9"') + C(80, 48, 7, "#121417");
  },
  // XIA engines: two little modules
  xia: function () {
    var s = "";
    for (var m = 0; m < 2; m++) {
      var x = 34 + m * 48;
      s += R(x, 6, 44, 88, "#c9ccd2", 2, ' stroke="#9a9ea6"') + C(x + 5, 10, 1.6, "#7d8189") + C(x + 39, 90, 1.6, "#7d8189") +
        knob(x + 22, 30, 9, "#1d1f22", "#e9e7e2") + knob(x + 12, 54, 5, "#1d1f22", "#e9e7e2") + knob(x + 32, 54, 5, "#1d1f22", "#e9e7e2") +
        C(x + 36, 14, 2, m ? "#19ffe0" : "#ff1fd6");
      for (var j = 0; j < 3; j++) s += C(x + 10 + j * 12, 78, 4, "#2a2c30") + C(x + 10 + j * 12, 78, 1.8, "#0c0d0f");
    }
    return s;
  },
  // Bass line: a silver box with knobs and a row of key buttons
  tb303: function () {
    var s = R(8, 22, 144, 58, "#cfd2d6", 5, ' stroke="#a5a9af"');
    for (var i = 0; i < 6; i++) s += knob(22 + i * 20, 36, 5.5, "#1d1f22", "#e9e7e2");
    s += C(140, 36, 3, "#ff3b2f");
    var black = [1, 3, 6, 8, 10];
    for (var k = 0; k < 13; k++) s += R(16 + k * 10, 54, 8, 16, black.indexOf(k) >= 0 ? "#3a3d44" : "#f4f4f2", 1.5);
    return s;
  },
  // Subtractive: a mono synth with a filter curve on its screen
  subt: function () {
    var s = R(8, 10, 144, 80, "#24272c", 6) + R(16, 18, 50, 28, "#0f1114", 3) + L("M20 30 H42 Q52 22 56 40 L62 44", "#ff1fd6", 2);
    for (var i = 0; i < 4; i++) s += knob(80 + i * 18, 25, 5.5, "#c9ccd2", "#24272c") + knob(80 + i * 18, 40, 5.5, "#c9ccd2", "#24272c");
    return s + keys(14, 54, 132, 30, 16, "#f1efe9", "#1b1c20");
  },
  // FM: an operator algorithm on the panel
  fm: function () {
    var s = R(8, 10, 144, 80, "#262a31", 6), op = ' stroke="#ff1fd6" stroke-width="1.6"';
    s += R(18, 15, 14, 9, "none", 2, op) + R(18, 33, 14, 9, "none", 2, op) + R(42, 15, 14, 9, "none", 2, op) + R(42, 33, 14, 9, "none", 2, op) +
      L("M25 24 V33 M49 24 V33 M25 42 V47 H49 V42", "#ff1fd6", 1.4) + R(68, 16, 74, 12, "#0d2a26", 2) + R(72, 20, 40, 3, "#19ffe0", 1);

    if (d.length) sel.value = d[0].id;
  }
  if (!outs.length) setStatus("No MIDI devices. Plug in the Deluge, then reload.", "bad");
}

function usePort() {
  if (input) input.onmidimessage = null;
  output = midi.outputs.get($("port").value) || null;
  input = null;
  if (output) {
    // The Deluge replies on the cable the request came in on: match the input by name
    midi.inputs.forEach(function (i) { if (!input && i.name === output.name) input = i; });
    if (!input) midi.inputs.forEach(function (i) { if (!input && /deluge/i.test(i.name)) input = i; });
  }
  if (!output || !input) { setStatus("Pick the Deluge port", "bad"); return; }
  input.onmidimessage = onMessage;
  lastSeq = -1; dropped = 0;
  send(0);
  sendDisplay(true);
  setStatus("Asked " + output.name + " for state...", "warn");
}

var wakeLock = null;
function keepAwake() {
  if (!navigator.wakeLock || document.visibilityState !== "visible") return;
  navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }, function () {});
}
document.addEventListener("visibilitychange", keepAwake);

function connect() {
  if (!navigator.requestMIDIAccess) { setStatus("This browser has no Web MIDI. Use Chrome.", "bad"); return; }
  navigator.requestMIDIAccess({ sysex: true }).then(function (access) {
    midi = access;
    midi.onstatechange = function () { listPorts(); };
    listPorts();
    usePort();
    if (keepAlive) clearInterval(keepAlive);
    keepAlive = setInterval(function () {
      send(1);
      sendDisplay(false);
      var age = Date.now() - lastMessageAt;
      if (!lastMessageAt) setStatus("Connected to " + (output ? output.name : "?") +
        ". No reply yet: is this a Bribes companion build?", "warn");
      else setStatus("Live on " + output.name + " (last message " + Math.round(age / 1000) + " s ago)", "ok");
    }, 1000);
    $("connect").textContent = "Resend";
    keepAwake();
  }, function (err) { setStatus("MIDI access refused: " + err, "bad"); });
}
$("connect").onclick = connect;
$("bLoad").onclick = function () { if (output) output.send(HDR.concat([0x03, 0x04, 0xF7])); };
$("bBack").onclick = function () { if (output) output.send(HDR.concat([0x03, 0x05, 0xF7])); };

// Once MIDI with SysEx has been allowed, connect on launch without a tap
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: "midi", sysex: true }).then(function (p) {
    if (p.state === "granted") connect();
  }, function () {});
}
// Works offline once opened: the service worker keeps a copy of the app
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
buildMirror();
setScreenMode("7seg");
$("heroArt").innerHTML = art("none");
$("mode7").onclick = function () { wantScreen("7seg"); };
$("modeOled").onclick = function () { wantScreen("oled"); };
// Leaving the page in OLED mode would leave the 7-seg frozen: swap back on the way out
window.addEventListener("pagehide", function () { if (screenMode === "oled" && output) output.send(HDR.concat([0x00, 0x04, 0xF7])); });
$("port").onchange = function () { if (midi) usePort(); };
if (typeof module !== "undefined") module.exports = { parse: parse, art: art, ART: ART };
</script>
